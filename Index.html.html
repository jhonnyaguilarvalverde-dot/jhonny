<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Estudiantes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .guardar {
            background-color: #198754;
            color: white;
        }

        .eliminar {
            background-color: #dc3545;
            color: white;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #eee;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Registro de Estudiantes</h1>

    <div class="formulario">

        <input type="text" id="nombre" placeholder="Nombre">

        <input type="text" id="apellido" placeholder="Apellido">

        <input type="number" id="edad" placeholder="Edad">

        <input type="text" id="carrera" placeholder="Carrera">

        <button class="guardar" onclick="guardarEstudiante()">
            Guardar estudiante
        </button>

    </div>

    <table>

        <thead>
            <tr>
                <th>N°</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Edad</th>
                <th>Carrera</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody id="tablaEstudiantes">
        </tbody>

    </table>

</div>

<script>

    // Recuperar estudiantes almacenados
    let estudiantes = JSON.parse(
        localStorage.getItem("estudiantes")
    ) || [];


    // FUNCIÓN PARA GUARDAR ESTUDIANTE
    function guardarEstudiante() {

        let nombre = document.getElementById("nombre").value;
        let apellido = document.getElementById("apellido").value;
        let edad = document.getElementById("edad").value;
        let carrera = document.getElementById("carrera").value;


        // Validar campos
        if (nombre === "" || apellido === "" ||
            edad === "" || carrera === "") {

            alert("Complete todos los campos");
            return;
        }


        // Crear objeto estudiante
        let estudiante = {

            nombre: nombre,
            apellido: apellido,
            edad: edad,
            carrera: carrera

        };


        // Agregar estudiante al arreglo
        estudiantes.push(estudiante);


        // Guardar arreglo en LocalStorage
        localStorage.setItem(
            "estudiantes",
            JSON.stringify(estudiantes)
        );


        // Limpiar formulario
        document.getElementById("nombre").value = "";
        document.getElementById("apellido").value = "";
        document.getElementById("edad").value = "";
        document.getElementById("carrera").value = "";


        // Actualizar tabla
        mostrarEstudiantes();

        alert("Estudiante guardado correctamente");
    }


    // FUNCIÓN PARA MOSTRAR ESTUDIANTES
    function mostrarEstudiantes() {

        let tabla = document.getElementById("tablaEstudiantes");

        tabla.innerHTML = "";


        estudiantes.forEach(function(estudiante, indice) {

            tabla.innerHTML += `

                <tr>

                    <td>${indice + 1}</td>

                    <td>${estudiante.nombre}</td>

                    <td>${estudiante.apellido}</td>

                    <td>${estudiante.edad}</td>

                    <td>${estudiante.carrera}</td>

                    <td>
                        <button
                            class="eliminar"
                            onclick="eliminarEstudiante(${indice})">
                            Eliminar
                        </button>
                    </td>

                </tr>

            `;

        });

    }


    // FUNCIÓN PARA ELIMINAR
    function eliminarEstudiante(indice) {

        if (confirm("¿Desea eliminar este estudiante?")) {

            estudiantes.splice(indice, 1);

            localStorage.setItem(
                "estudiantes",
                JSON.stringify(estudiantes)
            );

            mostrarEstudiantes();
        }

    }


    // Mostrar datos cuando se carga la página
    mostrarEstudiantes();

</script>
